name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle Wrapper
        if: runner.os != 'Windows'
        run: |
          chmod +x gradlew
          ./gradlew build verifyInstall

      - name: Build with Gradle Wrapper
        if: runner.os == 'Windows'
        run: .\gradlew.bat build verifyInstall

      - name: JavaFX FXML display smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew javafxDisplaySmoke

  package:
    name: Package ${{ matrix.variant }}
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - variant: desktop
            mac-platform: mac
          - variant: apple-silicon
            mac-platform: mac-aarch64

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Package distribution
        run: |
          chmod +x gradlew
          ./gradlew shadowJar -PmacJavaFxPlatform=${{ matrix.mac-platform }}

      - name: Retain distribution
        uses: actions/upload-artifact@v7
        with:
          name: ClubStock-${{ matrix.variant }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/libs/ClubStock-*-${{ matrix.variant }}.jar
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  dependency-submission:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6
