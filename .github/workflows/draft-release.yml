name: Stage Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    name: Stage ${{ github.ref_name }} as a draft
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Release tags must use v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          project_version="$(sed -nE "s/^version = '([^']+)'$/\1/p" build.gradle)"
          if [ "$project_version" != "$version" ]; then
            echo "Tag version $version does not match build.gradle version $project_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Find successful master verification
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/gradle.yml/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f event=push \
            -f status=success \
            -F per_page=100 > ci-runs.json
          run="$(jq -c --arg sha "$GITHUB_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and
              .head_branch == "master" and
              .event == "push" and
              .conclusion == "success"
            )] | sort_by(.created_at) | last // empty
          ' ci-runs.json)"
          if [ -z "$run" ]; then
            echo "No successful master CI run found for $GITHUB_SHA" >&2
            exit 1
          fi
          echo "run_id=$(jq -r '.id' <<< "$run")" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$(jq -r '.run_attempt' <<< "$run")" >> "$GITHUB_OUTPUT"
          echo "Using verified CI run $(jq -r '.id' <<< "$run") attempt $(jq -r '.run_attempt' <<< "$run")"

      - name: Download verified desktop distribution
        uses: actions/download-artifact@v8
        with:
          name: ClubStock-desktop-${{ github.sha }}-${{ steps.ci.outputs.run_attempt }}
          path: distributions/desktop
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download verified Apple Silicon distribution
        uses: actions/download-artifact@v8
        with:
          name: ClubStock-apple-silicon-${{ github.sha }}-${{ steps.ci.outputs.run_attempt }}
          path: distributions/apple-silicon
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Validate distributions and create checksums
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          desktop_jars=("distributions/desktop/ClubStock-${VERSION}-desktop.jar")
          apple_silicon_jars=("distributions/apple-silicon/ClubStock-${VERSION}-apple-silicon.jar")
          for jar in "${desktop_jars[@]}" "${apple_silicon_jars[@]}"; do
            if [ ! -s "$jar" ]; then
              echo "Expected nonempty verified distribution at $jar" >&2
              exit 1
            fi
          done
          mkdir -p release-assets
          cp "${desktop_jars[0]}" "${apple_silicon_jars[0]}" release-assets/
          (cd release-assets && shasum -a 256 ./*.jar > SHA256SUMS.txt)

      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if release_is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "$release_is_draft" != "true" ]; then
              echo "Release $GITHUB_REF_NAME already exists and is published" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --generate-notes \
              --title "ClubStock $GITHUB_REF_NAME" \
              --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" \
            release-assets/*.jar release-assets/SHA256SUMS.txt \
            --clobber
