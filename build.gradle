buildscript {
    dependencies {
        constraints {
            // Shadow's transitive build dependencies need these security fixes.
            classpath('org.apache.logging.log4j:log4j-core:2.25.5') {
                because 'Upgrade vulnerable Log4j Core pulled in by Shadow'
            }
            classpath('org.apache.logging.log4j:log4j-api:2.25.5') {
                because 'Upgrade vulnerable Log4j API and align it with Core'
            }
            classpath('org.codehaus.plexus:plexus-utils:4.0.3') {
                because 'Upgrade vulnerable Plexus Utils pulled in by Shadow'
            }
        }
    }
}

plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.2.2'
}

version = '0.4.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

def macJavaFxPlatform = providers.gradleProperty('macJavaFxPlatform').getOrElse(
        System.getProperty('os.arch') in ['aarch64', 'arm64'] ? 'mac-aarch64' : 'mac')
if (!(macJavaFxPlatform in ['mac', 'mac-aarch64'])) {
    throw new GradleException('macJavaFxPlatform must be mac or mac-aarch64')
}

dependencies {
    String javaFxVersion = '25.0.3'
    // Both macOS architectures use the same native filenames: package only one.
    ['base', 'controls', 'fxml', 'graphics'].each { module ->
        ['win', macJavaFxPlatform, 'linux'].each { platform ->
            implementation("org.openjfx:javafx-${module}:${javaFxVersion}:${platform}")
        }
    }
    implementation 'com.ibm.icu:icu4j:78.3'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'

    testImplementation platform('org.junit:junit-bom:5.14.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'display'
    }
    systemProperty 'clubstock.testRuntimeClasspath', sourceSets.test.runtimeClasspath.asPath
}

tasks.register('javafxDisplaySmoke', Test) {
    group = 'verification'
    description = 'Runs the display-backed JavaFX/FXML smoke test.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'display'
    }
}

tasks.named('shadowJar') {
    archiveBaseName = 'ClubStock'
    archiveClassifier = macJavaFxPlatform == 'mac' ? 'desktop' : 'apple-silicon'
    mergeServiceFiles()
}

def verificationJava = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
}

tasks.register('verifyInstall', Exec) {
    group = 'verification'
    description = 'Runs the packaged fat JAR in its isolated noninteractive verification mode.'
    dependsOn tasks.named('shadowJar')
    doFirst {
        commandLine verificationJava.get().executablePath.asFile.absolutePath,
                '-jar', tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath,
                '--verify-install'
    }
}

application {
    mainClass.set("clubstock.Launcher")
}

def catalogDemoDataDirectory = layout.buildDirectory.dir('clubstock-demo')

tasks.register('seedCatalogDemo', JavaExec) {
    group = 'application'
    description = 'Creates the temporary Member account used to exercise the catalogue.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass.set('clubstock.fixture.CatalogDemoSeeder')
    workingDir = projectDir
}

tasks.register('runCatalogDemo', JavaExec) {
    group = 'application'
    description = 'Seeds and runs ClubStock with isolated catalogue demo data.'
    dependsOn tasks.named('seedCatalogDemo')
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set(application.mainClass)
    workingDir = projectDir
    systemProperty 'clubstock.dataDir', catalogDemoDataDirectory.get().asFile.absolutePath
}

tasks.register('runCatalogDemoJar', JavaExec) {
    group = 'application'
    description = 'Seeds and runs the packaged ClubStock JAR with isolated catalogue demo data.'
    dependsOn tasks.named('seedCatalogDemo'), tasks.named('shadowJar')
    classpath = files(tasks.named('shadowJar').flatMap { it.archiveFile })
    mainClass.set(application.mainClass)
    workingDir = projectDir
    systemProperty 'clubstock.dataDir', catalogDemoDataDirectory.get().asFile.absolutePath
}
